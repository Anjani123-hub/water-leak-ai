<!doctype html><meta charset=utf-8>
<script>window.API_BASE="https://water-leak-ai-j7h6.onrender.com"</script>
<link rel=stylesheet href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>body{font:14px system-ui;margin:20px;max-width:1000px}button{margin-right:6px;padding:6px 12px}
.card{border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0}pre{white-space:pre-wrap}</style>
<h2>Agentic Water Leak Detection - Operator Dashboard</h2>
<button onclick="go('normal')">TC-01 Normal</button><button onclick="go('leak')">TC-04 Leak</button>
<button onclick="go('bad_sensor')">TC-06 Bad sensor</button>
<button onclick="re()">TC-07 Reassess</button><button onclick="window.open(API+'/api/report.pdf')">PDF report</button>
<button onclick="window.open(API+'/api/sample.csv')">Sample CSV</button> Upload CSV: <input type=file accept=.csv onchange="up(this)">
<div id=out></div><canvas id=c height=90></canvas>
<h3>Network map (green normal, red suspected leak, orange sensor problem)</h3><div id=map style="height:380px"></div><div id=tm class=card></div>
<script>
const API=window.API_BASE||'';let ch;
async function go(s,d){
 d=d||await (await fetch(API+'/api/run?scenario='+s)).json();
 let h=`<div class=card><b>Summary</b><pre>${d.summary.join('\n')}</pre><b>Reviewer:</b> ${d.review.join('; ')}<br><b>Agents:</b> ${d.trace.join(' → ')}</div>`;
 d.leaks.forEach(l=>h+=`<div class=card><b>${l.leak_id} ${l.zone}</b> – ${l.status} (${l.confidence})<br>Section: ${l.suspected_section}<br>
 Evidence: ${l.evidence.join('; ')}<br>Est. loss: ${l.est_loss_m3} m³ (${l.loss_assumption})<br>Priority: ${l.plan.priority_score}, team ${l.plan.suggested_team}<br>
 <button onclick="act('/api/approve/${l.leak_id}/${l.plan.suggested_team}')">Approve inspection</button>
 <button onclick="act('/api/repair/${l.leak_id}')">Record repair + validate</button></div>`);
 h+=`<div class=card><b>Water balance</b><pre>${JSON.stringify(d.water_balance,null,1)}</pre><b>Sensor issues</b><pre>${JSON.stringify(d.sensor_issues,null,1)}</pre><b>Forecast metrics</b><pre>${JSON.stringify(d.forecast_metrics)}</pre></div>`;
 out.innerHTML=h; setTimeout(()=>{drawMap();teams()},0); const b=d.series['DMA-B']; if(ch)ch.destroy();
 ch=new Chart(c,{type:'line',data:{labels:b.t,datasets:[{label:'DMA-B actual',data:b.actual},{label:'DMA-B forecast',data:b.forecast}]}});
}
async function re(){alert(JSON.stringify(await (await fetch(API+'/api/reassess')).json(),null,1))}
async function up(i){const f=new FormData();f.append('file',i.files[0]);go('upload',await (await fetch(API+'/api/upload',{method:'POST',body:f})).json())}
async function act(u){const r=await fetch(API+u,{method:'POST'});alert(JSON.stringify(await r.json(),null,1));teams()}
let mp,lg;
async function drawMap(){const n=await (await fetch(API+'/api/network')).json();
 if(!mp){mp=L.map('map').setView([16.5062,80.648],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mp);lg=L.layerGroup().addTo(mp)}
 lg.clearLayers();const col={normal:'green',suspected_leak:'red',sensor_problem:'orange'};
 n.pipes.forEach(p=>L.polyline([p.from,p.to],{color:col[p.status],weight:6}).bindPopup(p.pipe+' - '+p.status).addTo(lg));
 n.nodes.forEach(d=>L.circleMarker(d.pos,{radius:7,color:col[d.status]}).bindPopup(d.id+' ('+d.kind+') - '+d.status).addTo(lg))}
async function teams(){const s=await (await fetch(API+'/api/state')).json();
 tm.innerHTML='<b>Field teams</b><pre>'+JSON.stringify(s.teams,null,1)+'</pre><button onclick="addTeam()">Add team</button>'}
async function addTeam(){const id=prompt('Team ID, e.g. T3');if(!id)return;await fetch(API+'/api/teams/'+id+'?skills=acoustic',{method:'POST'});teams()}
go('leak');
</script>
